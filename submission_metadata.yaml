# ============================================================================
# Compute environment
# ============================================================================
compute:
  platform: "Local Windows 11 workstation"      # Or: "AWS EC2 c5.4xlarge", "Local Linux box", etc.
  cpu_cores: 12                                 # Number of CPU cores used
  ram_gb: 16                                    # Available RAM in GB
  python_version: "3.11-slim Docker runtime; local verification used 3.14.3"  # python --version
  os: "Windows-11-10.0.26200-SP0"               # Or "Ubuntu 22.04 LTS", etc.
  uses_gpu_for_inference: false                 # Must be false — see compute constraints
  has_network_during_ranking: false             # Must be false — no API calls during ranking
  pre_computation_required: false               # true if you pre-compute embeddings or train models offline
  pre_computation_time_minutes: 0               # Approximate, if applicable

# ============================================================================
# AI tools declaration
# ============================================================================
# Transparency only — declared use is NOT penalized. Be honest. Stage 5 interview
# may verify these declarations against your code; declarations that contradict
# your code or your interview are flagged.
ai_tools_used:
  - "OpenCode / gpt-5.5"

ai_usage_summary: |
  Used OpenCode / gpt-5.5 for implementation, code review, test generation,
  documentation and adversarial release review. Ranking itself is deterministic,
  CPU-only and offline; no hosted LLM or API is called during ranking.

# ============================================================================
# Approach summary (optional but recommended)
# ============================================================================
methodology_summary: |
  Deterministic hybrid AI ranker that streams JSONL profiles and combines JD
  understanding, semantic retrieval and evidence-based scoring. Career-history
  evidence for ranking, retrieval, recommendation, matching, vector/search
  infrastructure, production ownership and evaluation remains dominant; semantic
  fit contributes 16% of the final score (0.84 x evidence-only + 0.16 x semantic)
  to improve paraphrase recall. Skill lists and profile summaries are supporting
  signals only. High-confidence integrity anomalies are excluded, medium-confidence
  anomalies are penalized, and low-confidence anomalies are warnings. Explanations
  are generated from the same evidence and semantic concepts used for scoring.

  Measured on the environment declared below, ranking all 100,000 candidates takes
  about 92s (two consecutive runs: 92.01s and 92.12s; 94.19s wall clock including
  process startup) with a peak process working set of about 512 MB. Most of that
  memory is interpreter plus numpy/sentence-transformers import overhead rather
  than ranking state; the ranker holds only a bounded top-K heap. Output is
  deterministic: two independent full runs produced byte-identical CSVs
  (SHA256 55e9fee8c1d7420193bbf39cb97dc11bdd22a5573f0cb3e2b50d0df192de3c99).
  93 tests plus 30 subtests pass. The honeypot scan reports no honeypot candidates
  in the top 100 (0.0% honeypot rate over 107 flagged records in 100,000).

